<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Tess vote — score</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1b1a18;--dim:#6f6a63;--line:#e6e1d9;--a:#2f6b57;--b:#c2553a;--sh:0 6px 30px rgba(0,0,0,.09)}
@media(prefers-color-scheme:dark){:root{--bg:#141313;--card:#1e1d1c;--ink:#f2efe9;--dim:#948e86;--line:#302e2b;--a:#5fbd9c;--b:#e88467;--sh:0 6px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;padding:30px 14px 70px}
.wrap{max-width:480px;margin:0 auto}
h1{font-size:28px;font-weight:700;margin:0 0 3px;text-align:center;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:13.5px;text-align:center;margin:0 0 26px}
.row{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
margin-bottom:11px;box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:11px}
.n{font-size:25px;font-weight:800;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.lbl{font-size:14.5px;font-weight:620;flex:1}
.who{font-size:12.5px;color:var(--dim);margin-top:5px}
.bar{height:7px;border-radius:4px;background:var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s}
.split{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:20px 0 6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center;box-shadow:var(--sh)}
.box h3{margin:0 0 7px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:680}
.box .v{font-size:15px;font-weight:650}
.foot{text-align:center;color:var(--dim);font-size:12.5px;margin-top:22px}
</style></head><body><div class="wrap">
<h1>The vote</h1><p class="sub" id="sub">loading&hellip;</p>
<div id="rows"></div>
<div class="split">
  <div class="box"><h3>By edit</h3><div class="v" id="bycut">–</div></div>
  <div class="box"><h3>By music</h3><div class="v" id="bymusic">–</div></div>
</div>
<p class="foot">Refreshes every 15 seconds.<br><a href="https://status.maitrib.ca/tess-vote/" style="color:var(--a)">open the vote page</a></p>
</div><script>
const L={"1":["What Is Love","Cut A · 50s","#c2553a"],"2":["What Is Love","Cut B · 63s","#c2553a"],
"3":["Blinding Lights","Cut A · 50s","#7a5bbd"],"4":["Blinding Lights → Yellow","Cut B · 63s","#7a5bbd"],
"5":["Our own tune","Cut A · 50s","#2f6b57"],"6":["Our own tune","Cut B · 63s","#2f6b57"]};
async function go(){
 try{
  const d=await (await fetch("https://status.maitrib.ca/tess-vote/api/tally",{cache:"no-store"})).json();
  const c=d.counts||{}, nm=d.names||{};
  const tot=Object.values(c).reduce((a,b)=>a+b,0), mx=Math.max(1,...Object.values(c));
  document.getElementById("sub").textContent=tot+(tot===1?" vote":" votes")+" so far";
  const ks=Object.keys(L).sort((a,b)=>(c[b]||0)-(c[a]||0));
  document.getElementById("rows").innerHTML=ks.map(k=>{
   const n=c[k]||0,[mus,cut,col]=L[k],who=(nm[k]||[]).join(", ");
   return `<div class="row"><div class="top"><div class="n" style="color:${col}">${n}</div>
   <div class="lbl">${mus}<span style="color:var(--dim);font-weight:400"> · ${cut}</span></div></div>
   ${who?`<div class="who">${who}</div>`:""}
   <div class="bar"><i style="width:${n/mx*100}%;background:${col}"></i></div></div>`}).join("");
  const A=(c["1"]||0)+(c["3"]||0)+(c["5"]||0), B=(c["2"]||0)+(c["4"]||0)+(c["6"]||0);
  const comm=(c["1"]||0)+(c["2"]||0)+(c["3"]||0)+(c["4"]||0), orig=(c["5"]||0)+(c["6"]||0);
  document.getElementById("bycut").textContent=`A ${A} · B ${B}`;
  document.getElementById("bymusic").textContent=`licensed ${comm} · ours ${orig}`;
 }catch(e){document.getElementById("sub").textContent="couldn't reach the counter";}
}
go(); setInterval(go,15000);
</script></body></html>
